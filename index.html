<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Workaround for environments that freeze window.fetch as a getter-only property
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() { return originalFetch; },
          set(val) { console.warn('Blocked attempt to overwrite window.fetch'); },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.error('Could not redefine window.fetch:', e);
      }
    </script>
